name: Security

on:
  pull_request:
    paths:
      - "Cargo.lock"
      - "Cargo.toml"
      - "crates/**/Cargo.toml"
      - "package.json"
      - "apps/**/package.json"
      - "pnpm-lock.yaml"
      - "scripts/**"
      - ".github/workflows/security.yml"
  push:
    branches: [main]
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install current stable Rust for the audit tool
        run: rustup toolchain install stable --profile minimal
      - name: Install cargo-audit
        run: cargo install --locked cargo-audit --version 0.22.2
        env:
          # The audit tool has its own MSRV and must not inherit the application's pin.
          RUSTUP_TOOLCHAIN: stable
      - name: Audit Rust dependencies
        run: cargo audit --deny warnings
        env:
          RUSTUP_TOOLCHAIN: stable
      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 10.26.0
          run_install: false
      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24.15.0
          cache: pnpm
      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Audit production JavaScript dependencies
        run: pnpm audit --prod --audit-level high --registry=https://registry.npmjs.org
